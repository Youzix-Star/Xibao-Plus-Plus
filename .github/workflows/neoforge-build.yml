name: Build NeoForge 1.21.1

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build NeoForge mod
        working-directory: NeoForge-1.21.1
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: XibaoPlusPlus-NeoForge-1.21.1
          path: NeoForge-1.21.1/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download built jar
        uses: actions/download-artifact@v4
        with:
          name: XibaoPlusPlus-NeoForge-1.21.1
          path: dist

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum *.jar > SHA256SUMS.txt

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          name: Xibao++ NeoForge 1.21.1 ${{ github.ref_name }}
          files: |
            dist/*.jar
            dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
